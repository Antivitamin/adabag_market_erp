<!DOCTYPE html>
<html>
<head>

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/adabag_market_erp/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Adabağ Market stok, fiyat ve son kullanma tarihi yönetimi.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Adabağ Market">

  <title>Adabağ Market</title>
  <link rel="manifest" href="manifest.json?v=20261107-icons-4">
  <style>
    html,body { margin:0; min-height:100%; background:#e8f1f6; }
    #app-loading { position:fixed; inset:0; z-index:9999; display:flex;
      align-items:center; justify-content:center; background:#e8f1f6; }
    #app-loading .loading-spinner { width:28px; height:28px; border:3px solid #35648130;
      border-top-color:#356481; border-radius:50%; animation:loading-spin .9s linear infinite; }
    @keyframes loading-spin { to { transform:rotate(360deg); } }
    @media(prefers-reduced-motion:reduce) { #app-loading .loading-spinner { animation:none; } }
    @media(prefers-color-scheme:dark) { html,body,#app-loading { background:#1d2a38; } }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Adabağ Market yükleniyor">
    <span class="loading-spinner" aria-hidden="true"></span>
  </div>
  <script>window.addEventListener('flutter-first-frame', function () {
    document.getElementById('app-loading')?.remove();
  }, { once:true });</script>
